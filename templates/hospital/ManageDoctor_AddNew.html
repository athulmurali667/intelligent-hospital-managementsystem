{% extends 'hospital/hospitalindex.html' %}
{% block body %}


<body>
<form action="/ManageDoctor_AddNew_post" method="post" enctype="multipart/form-data" name="form1" id="form1">
<table class="table table-bordered">
    <tr>
      <td>Name</td>
      <td colspan="2"><input type="text" name="textfield2" required/></td>
    </tr>
    <tr>
      <td>dob</td>
      <td colspan="2"><input type="date" name="textfield" /></td>
    </tr>
    <tr>
      <td>Gender </td>
      <td><select name="gen">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="others">Other</option>
      </select></td>

    <tr>
      <td>Qulification</td>
      <td colspan="2"><input type="text" name="textfield3" /></td>
    </tr>
    <tr>
      <td>Specialization</td>
      <td colspan="2"><input type="text" name="textfield4" /></td>
    </tr>
    <tr>
      <td>Phone</td>
      <td colspan="2"><p>
        <input type="text" name="textfield5" />
      </p>
        <p>&nbsp;</p></td>
    </tr>
    <tr>
      <td>Email</td>
      <td colspan="2"><input type="text" name="textfield6" /></td>
    </tr>
    <tr>
      <td>Department</td>
      <td colspan="2">
          <select name="ss">
              {% for i in dept %}
                  <option value="{{ i.id }}">{{ i.department }}</option>
              {% endfor %}
      </select>
      </td>
    </tr>
    <tr>
      <td>Photo</td>
      <td colspan="2"><input type="file" name="file" /></td>
    </tr>
    <tr>
      <td>Username</td>
      <td colspan="2"><input type="text" name="textfield7" /></td>
    </tr>
    <tr>
      <td>Password</td>
      <td colspan="2"><input type="text" name="textfield8" /></td>
    </tr>
    <tr>
      <td colspan="3"><input type="submit" name="Submit4" value="Add" /></td>
    </tr>
  </table>
</form>
</body>
</html>
{% endblock %}
