{% extends 'admin/adminindex.html' %}
{% block body %}



<body class="bg-light">
  <div class="container mt-5">
    <div class="card">
      <div class="card-header bg-info text-white">
        <h4>Search for a Patient</h4>
      </div>
      <div class="card-body">
        <form id="form1" name="form1" method="post" action="/viewpatient_search">
          <div class="form-group row">
            <label for="textfield" class="col-sm-2 col-form-label">Name:</label>
            <div class="col-sm-8">
              <input type="text" class="form-control" id="textfield" name="textfield" placeholder="Enter patient name">
            </div>
            <div class="col-sm-2">
              <button type="submit" class="btn btn-info btn-block">Search</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="table-responsive mt-4">
      <table class="table table-striped table-bordered">
        <thead class="thead-dark">
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Date of Birth</th>
            <th>Place</th>
            <th>Post</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Photo</th>
          </tr>
        </thead>
        <tbody>
          {% for i in pd %}
          <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.gender }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.place }}</td>
            <td>{{ i.post }}</td>
            <td>{{ i.phone }}</td>
            <td>{{ i.email }}</td>
            <td><img src="/media/{{ i.photo }}" alt="Photo" class="img-thumbnail" style="width: 100px; height: auto;"></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>

{% endblock %}
