{% extends 'admin/adminindex.html' %}
{% block body %}


<body>
    <div class="container form-container">
        <h2 class="text-center">Search Accepted Hospitals</h2>
        <form action="/admin_view_accepted_hospital_search#featured-cars" method="post" class="mb-4">
            <div class="form-group">
                <label for="textfield">Name:</label>
               <label> <input type="text" name="textfield" id="textfield" class="form-control" placeholder="Enter hospital name" required /></label>
             <button class="btn btn-info" type="submit" name="Submit">Submit</button> </div>

        </form>

        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Place</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Post</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for i in val %}
                <tr>
                    <td>{{ i.name }}</td>
                    <td>{{ i.place }}</td>
                    <td>{{ i.phone }}</td>
                    <td>{{ i.email }}</td>
                    <td>{{ i.post }}</td>
                    <td>
                        <a href="http://maps.google.com?q={{ i.latitude }},{{ i.longitude }}#a" class="btn btn-info">Track</a>
                        <a href="/viewdoctor/{{ i.id }}" class="btn btn-success">Doctors</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>


{% endblock %}
