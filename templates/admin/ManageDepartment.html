<body>
    <div class="container form-container">
        <h2 class="text-center">Manage Departments</h2>
        <form action="/ManageDepartment_search#featured-cars" method="post" class="mb-4">
            <div class="form-group">
                <label for="textfield">Department Name:</label>
               <label><input type="text" name="textfield" id="textfield" class="form-control" placeholder="Enter department name" required /></label>
           <button class="btn btn-info" type="submit" name="Submit">Submit</button>
            </div>

        </form>

        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>Department</th>
                    <th>Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for i in val %}
                <tr>
                    <td>{{ i.department }}</td>
                    <td>{{ i.details }}</td>
                    <td>
                        <a href="/deletedepartment/{{ i.id }}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="add-department">
            <a href="/adddep#a" class="btn btn-success">Add New Department</a>
        </div>
    </div>
