{% extends 'doctor/doctorindex.html' %}

{% block body %}

        <h1>Appointment Schedule</h1>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>From Time</th>
                    <th>To Time</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>{{ i.fromtime }}</td>
                    <td>{{ i.totime }}</td>
                    <td>{{ i.date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>


{% endblock %}
