{% extends 'user/userindex.html' %}
{% block body %}


<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Page</title>
  <!-- Bootstrap CSS -->

</head>

<body>
  <div class="container mt-5">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Profile</h4>
        <button class="btn btn-primary" id="editBtn">Edit Profile</button>
      </div>
      <div class="card-body">
        <!-- View Mode -->
        <div id="viewMode">
          <div class="text-center mb-4">
            <!-- Image displayed in view mode -->
            <img src="/media/{{ doc.photo }}" id="profileImgView" alt="Profile Photo" class="profile-img">
          </div>
          <p><strong>Name:</strong> <span id="viewName">{{ doc.name }}</span></p>
          <p><strong>Gender:</strong> <span id="viewGender">{{ doc.gender }}</span></p>
          <p><strong>Age:</strong> <span id="viewAge">{{ doc.age }}</span></p>
          <p><strong>Place:</strong> <span id="viewPlace">{{ doc.place }}</span></p>
          <p><strong>Post:</strong> <span id="viewPost">{{ doc.post }}</span></p>
          <p><strong>Phone:</strong> <span id="viewPhone">{{ doc.phone }}</span></p>
          <p><strong>Email:</strong> <span id="viewEmail">{{ doc.email }}</span></p>
        </div>

        <!-- Edit Mode -->
        <form id="editMode" class="hidden" method="post" action="/user_updateprofile_post" enctype="multipart/form-data">
          <div class="text-center mb-4">
            <!-- Image displayed in edit mode with file input -->
            <img src="/media/{{ doc.photo }}" id="profileImgEdit" alt="Profile Photo" class="profile-img mb-2">
            <input type="file" name="file" id="fileInput" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" name="name" id="nameInput" value="{{ doc.name }}">
          </div>
          <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" name="gender" id="genderSelect">
              <option value="male" {% if doc.gender == 'male' %}selected{% endif %}>Male</option>
              <option value="female" {% if doc.gender == 'female' %}selected{% endif %}>Female</option>
              <option value="other" {% if doc.gender == 'other' %}selected{% endif %}>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="text" class="form-control" name="age" value="{{ doc.age }}">
          </div>
          <div class="mb-3">
            <label for="place" class="form-label">Place</label>
            <input type="text" class="form-control" name="place" value="{{ doc.place }}">
          </div>
          <div class="mb-3">
            <label for="post" class="form-label">Post</label>
            <input type="text" class="form-control" name="post" value="{{ doc.post }}">
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" value="{{ doc.phone }}">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control" name="email" value="{{ doc.email }}">
            <input type="hidden" name="id" value="{{ doc.id }}">
          </div>
          <button type="submit" class="btn btn-success">Save Changes</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript for toggling between view and edit mode -->
  <script>
    const editBtn = document.getElementById('editBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const viewMode = document.getElementById('viewMode');
    const editMode = document.getElementById('editMode');
    const fileInput = document.getElementById('fileInput');
    const profileImgEdit = document.getElementById('profileImgEdit');
    const profileImgView = document.getElementById('profileImgView');

    editBtn.addEventListener('click', function () {
      viewMode.classList.add('hidden');
      editMode.classList.remove('hidden');
    });

    cancelBtn.addEventListener('click', function () {
      editMode.classList.add('hidden');
      viewMode.classList.remove('hidden');
    });

    // Preview image after selecting a new file
    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          // Update the profile image in both view and edit mode
          profileImgEdit.src = e.target.result;
          profileImgView.src = e.target.result;
        };
        reader.readAsDataURL(file); // Read the file as a data URL to preview
      }
    });
  </script>
</body>
</html>
{% endblock %}
